name: Clock repository heartbeat

on:
  schedule:
    - cron: "41 3 1,15 * *"

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Record repository activity
        shell: python
        run: |
          import base64
          import datetime
          import json
          import os
          import urllib.error
          import urllib.request

          path = ".clock-heartbeat"
          base = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/contents/{path}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          sha = None
          try:
              with urllib.request.urlopen(urllib.request.Request(base, headers=headers), timeout=30) as response:
                  current = json.loads(response.read(65537))
                  sha = current.get("sha")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise

          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%MZ\n")
          body = {
              "message": "chore: refresh clock heartbeat [skip ci]",
              "content": base64.b64encode(stamp.encode()).decode(),
              "branch": os.environ["DEFAULT_BRANCH"],
          }
          if sha:
              body["sha"] = sha
          request = urllib.request.Request(
              base,
              data=json.dumps(body).encode(),
              headers={**headers, "Content-Type": "application/json"},
              method="PUT",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201):
                  raise RuntimeError("heartbeat commit failed")
          print(json.dumps({"state": "HEARTBEAT_COMMITTED"}))
